version: "3.8"

services:
  backend:
    build: .
    env_file:
      - ./.env
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    networks:
      - intern-book-network

  mysql:
    container_name: "Intern-Book-DB"
    image: mysql:8.0
    env_file:
      - ./.env
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - intern-book-network

  mysql-admin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - intern-book-network

volumes:
  dbdata:

networks:
  intern-book-network:
    driver: bridge
