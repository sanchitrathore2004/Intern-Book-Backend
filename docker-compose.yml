version: "3.8"
services:
  backend:
    container_name: "Intern-Book-Backend"
    build: .
    env_file:
      - ./.env
    depends_on:
      - mysql
    networks:
      - intern-book-network

  mysql:
    container_name: "Intern-Book-DB"
    image: mysql:8.0
    env_file:
      - ./.env
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - intern-book-network
volumes:
  dbdata:

networks:
  intern-book-network:
    external: true
    name: intern-book-network


